name: run-tests

on:
  push:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'
  pull_request:
    paths:
      - '**.php'
      - '.github/workflows/run-tests.yml'
      - 'phpunit.xml.dist'
      - 'composer.json'
      - 'composer.lock'

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    defaults:
      run:
        working-directory: Skeleton
    strategy:
      fail-fast: true
      matrix:
        os: [ubuntu-latest]
        php: [8.5]
        laravel: [13.*, 12.*]
        stability: [prefer-stable]
        include:
          - laravel: 13.*
            testbench: 11.*
          - laravel: 12.*
            testbench: 10.*

    name: P${{ matrix.php }} - L${{ matrix.laravel }} - ${{ matrix.stability }} - ${{ matrix.os }}

    steps:
      - name: Checkout Skeleton template
        uses: actions/checkout@v7
        with:
          path: Skeleton

      - name: Checkout Modulus (path repository sibling)
        uses: actions/checkout@v7
        with:
          repository: InEngine/Modulus
          ref: feat/modulus-state-store
          path: Modulus
          # Default GITHUB_TOKEN cannot read other private org repos.
          token: ${{ secrets.INENGINE_CI_TOKEN }}

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: dom, curl, libxml, mbstring, zip, pcntl, pdo, sqlite, pdo_sqlite, bcmath, soap, intl, gd, exif, iconv, imagick, fileinfo
          coverage: none

      - name: Setup problem matchers
        run: |
          echo "::add-matcher::${{ runner.tool_cache }}/php.json"
          echo "::add-matcher::${{ runner.tool_cache }}/phpunit.json"

      - name: Allow Composer install on unconfigured template
        run: |
          # Template keeps Spatie placeholders; not a Packagist package. CI uses a fixture name only.
          perl -pi -e 's#":vendor_slug/:package_slug"#"inengine/skeleton-ci"#g' composer.json

      - name: Install dependencies
        run: |
          composer require "laravel/framework:${{ matrix.laravel }}" "orchestra/testbench:${{ matrix.testbench }}" --no-interaction --no-update
          composer update --${{ matrix.stability }} --prefer-dist --no-interaction

      - name: List Installed Dependencies
        run: composer show -D

      - name: Execute tests
        run: vendor/bin/pest --ci
